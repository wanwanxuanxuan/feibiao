<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='14' font-weight='800' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E">
<title>NEON 2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-layer"></div>

<main class="app">
  <header class="header">
    <div class="brand">
      <span class="brand-mark">N</span>
      <div class="brand-text">
        <h1>NEON 2048</h1>
        <p>合并方块，抵达 2048</p>
      </div>
    </div>
    <div class="scores">
      <div class="score-card">
        <span class="score-label">当前</span>
        <span id="score" class="score-value">0</span>
      </div>
      <div class="score-card best">
        <span class="score-label">最佳</span>
        <span id="best" class="score-value">0</span>
      </div>
    </div>
  </header>

  <section class="toolbar">
    <button id="newGame" class="btn primary" type="button">新游戏</button>
    <button id="undo" class="btn ghost" type="button" disabled>撤销</button>
    <div class="hint">
      <span class="kbd">↑</span><span class="kbd">↓</span><span class="kbd">←</span><span class="kbd">→</span>
      <span class="hint-text">方向键 / 滑动</span>
    </div>
  </section>

  <section class="board-wrap">
    <div id="board" class="board" tabindex="0" aria-label="游戏棋盘"></div>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="overlay-card">
        <div class="overlay-art" aria-hidden="true">
          <span class="art-tile c2">2</span>
          <span class="art-tile c4">4</span>
          <span class="art-tile c8">8</span>
          <span class="art-tile c16">16</span>
          <span class="art-tile c32">32</span>
          <span class="art-tile c64">64</span>
          <span class="art-tile c128">128</span>
          <span class="art-tile c256">256</span>
          <span class="art-tile c512">512</span>
          <span class="art-tile c1024">1024</span>
          <span class="art-tile c2048">2048</span>
          <span class="art-tile c2">2</span>
          <span class="art-tile c4">4</span>
          <span class="art-tile c8">8</span>
          <span class="art-tile c16">16</span>
          <span class="art-tile c32">32</span>
        </div>
        <h2 id="overlayTitle">准备好了吗？</h2>
        <p id="overlayText">合并相同数字方块，挑战 2048。</p>
        <button id="overlayBtn" class="btn primary" type="button">开始游戏</button>
      </div>
    </div>
  </section>

  <footer class="footer">
    <span>纯前端实现 · 本地保存最佳成绩</span>
  </footer>
</main>

<script src="script.js"></script>
</body>
</html>
