<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404</title>
<style>
  :root{
    --bg:#f6f7fb;--text:#1a1d29;--muted:#6b7280;
    --primary:#6366f1;--primary-2:#8b5cf6;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0e1018;--text:#e9eaf2;--muted:#9aa0b3}
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;position:relative;overflow:hidden;
  }
  body::before{
    content:"";position:absolute;inset:0;z-index:-1;
    background:
      radial-gradient(55% 45% at 18% 12%, color-mix(in srgb,var(--primary) 20%,transparent), transparent 70%),
      radial-gradient(50% 45% at 85% 85%, color-mix(in srgb,var(--primary-2) 18%,transparent), transparent 70%);
  }
  .wrap{text-align:center;max-width:560px}
  h1{
    margin:0;
    font-size:clamp(86px,18vw,150px);
    line-height:1;font-weight:800;letter-spacing:-.04em;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p{
    margin:18px 0 0;font-size:clamp(15px,2.2vw,18px);
    color:var(--muted);line-height:1.8;font-weight:500;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p>暂时没有你查找的页面欧（QwQ）</p>
  </div>
</body>
</html>
