<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>probe</title></head>
<body>
<div id="out">start</div>
<script>
var out = document.getElementById('out');
function log(s) { out.textContent += ' | ' + s; }
log(this === window ? 'window-ok' : 'globals?');
log('WEBSEARCH=' + (typeof window.WEBSEARCH));
</script>
<script src="./websearch.js?v=20261031f"></script>
<script>
log('after-load WEBSEARCH=' + (typeof window.WEBSEARCH));
if (window.WEBSEARCH) {
  var t0 = Date.now();
  window.WEBSEARCH.search('周杰伦').then(function (list) {
    log('search ' + (Date.now() - t0) + 'ms count=' + list.length);
    (list || []).slice(0, 3).forEach(function (r) { log(r.source + ':' + r.title); });
  }).catch(function (e) {
    log('search ERR ' + e.message);
  });
}
</script>
</body></html>
