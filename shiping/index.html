<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频播放</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
  <iframe
    src="https://player.bilibili.com/player.html?bvid=BV1pEJ863EoM&page=1&high_quality=1&danmaku=1&autoplay=1&as_wide=1"
    scrolling="no"
    frameborder="no"
    framespacing="0"
    allowfullscreen="true"
    allow="autoplay; fullscreen; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</body>
</html>
