<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Inter","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;position:relative;overflow:hidden;text-align:center;
    background-color:#1b1d27;
    background-image:url("/assets/404-bg-mosaic.jpg?v=1"),linear-gradient(135deg,#2b2f45,#4b3b6b);
    background-position:center;background-size:cover;background-repeat:no-repeat;
  }
  /* 图片上的压暗层，保证纯文字可读 */
  body::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:linear-gradient(180deg,rgba(8,10,16,.62),rgba(8,10,16,.72));
  }
  h1,p{position:relative;z-index:1}
  h1{
    margin:0;
    font-size:clamp(76px,15vw,140px);
    line-height:1;font-weight:800;letter-spacing:-.03em;
    color:#fff;
    text-shadow:0 4px 22px rgba(0,0,0,.55);
  }
  /* 与上一行之间空两行 */
  .t1{
    margin:3.2em 0 0;
    font-size:clamp(20px,3vw,30px);
    line-height:1.6;font-weight:700;
    color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,.5);
  }
  /* 与上一行之间空两行 */
  .t2{
    margin:3.6em 0 0;
    font-size:clamp(15px,2.2vw,21px);
    line-height:1.8;font-weight:500;
    color:rgba(255,255,255,.92);
    text-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  @media(max-width:520px){
    body{padding:28px 18px}
  }
  /* 页面最底部的一行字 */
  .bottom{
    position:fixed;left:0;right:0;bottom:26px;z-index:1;
    margin:0;padding:0 18px;
    font-size:clamp(12px,1.5vw,15px);
    line-height:1.6;font-weight:500;letter-spacing:.02em;
    color:rgba(255,255,255,.8);
    text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
  <h1>404</h1>
  <p class="t1" id="title">404 啦！页面它跑丢了 (ﾉД`)</p>
  <p class="t2" id="desc">你找的页面可能被小猫咪叼走了喵～ (ฅ´ω`ฅ)</p>
  <p class="bottom">孩子，回去写你的作业吧，这里没有你要找的东西</p>

<script>
  var TITLES = [
    '404 啦！页面它跑丢了 (ﾉД`)',
    '哎呀……这个页面好像不存在呢 (´；ω；`)',
    'Oops！404 出没注意！(QwQ)',
    '页面走丢了，正在哭唧唧 (ᗒᗣᗕ)՞'
  ];
  var DESCS = [
    '你找的页面可能被小猫咪叼走了喵～ (ฅ´ω`ฅ)',
    '呜呜……这个地址好像不太对劲呢 (QwQ)',
    '页面它偷偷溜出去玩了，暂时找不到啦 (´･ω･`)',
    '抱歉抱歉！这里什么都没有，空空如也～ (ＱωＱ)',
    '这个页面可能已经搬家了，或者从来没存在过……(´；д；`)'
  ];
  function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
  document.getElementById('title').textContent = pick(TITLES);
  document.getElementById('desc').textContent = pick(DESCS);
</script>
</body>
</html>
